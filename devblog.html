<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>devblog — kira</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --muted: #a0a0a0;
      --line: #303030;
      --font: "League Spartan", "Century Gothic", "Avenir Next", system-ui, sans-serif;
      --pad: clamp(1.25rem, 4vw, 3rem);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    a { color: inherit; }
    :focus-visible { outline: 1px solid #fff; outline-offset: 5px; }

    .site-header {
      width: min(100% - 2 * var(--pad), 84rem);
      min-height: 6.5rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 2rem;
    }
    .logo {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-height: 2.65rem;
      padding: .35rem .7rem .2rem;
      border: 1px solid #fff;
      color: #fff;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1;
      text-decoration: none;
    }
    .nav { display: flex; align-items: center; gap: clamp(1.4rem, 3vw, 2.5rem); }
    .nav a {
      position: relative;
      padding: .55rem 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      white-space: nowrap;
      text-decoration: none;
      transition: color .2s ease;
    }
    .nav a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .2s ease;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { color: #fff; }
    .nav a:hover::after, .nav a:focus-visible::after, .nav a[aria-current="page"]::after { transform: scaleX(1); }

    .lang { position: relative; justify-self: end; z-index: 2; }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: color .2s ease;
    }
    .lang-toggle:hover, .lang.is-open .lang-toggle { color: #fff; }
    .lang-chevron { width: .65rem; height: .65rem; transition: transform .2s ease; }
    .lang.is-open .lang-chevron { transform: rotate(180deg); }
    .lang-menu {
      position: absolute;
      top: calc(100% + .5rem);
      right: 0;
      display: grid;
      grid-template-rows: 0fr;
      min-width: 8rem;
      visibility: hidden;
      transition: grid-template-rows .25s ease, visibility 0s linear .25s;
    }
    .lang.is-open .lang-menu { grid-template-rows: 1fr; visibility: visible; transition-delay: 0s; }
    .lang-menu ul {
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      list-style: none;
      background: #111;
    }
    .lang-menu button {
      width: 100%;
      padding: .55rem .9rem;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .lang-menu button:hover, .lang-menu button:focus-visible, .lang-menu button[aria-current="true"] { color: #fff; }


    .content {
      width: min(100% - 2 * var(--pad), 52rem);
      margin: 0 auto;
      padding: clamp(4rem, 9vw, 7rem) 0 6rem;
    }
    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(3rem, 7vw, 5rem);
      letter-spacing: -.045em;
      line-height: 1;
      overflow-wrap: anywhere;
    }
    .posts { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .post-link {
      display: grid;
      grid-template-columns: 8rem minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: center;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
    }
    .post-link:hover .post-title { text-decoration: underline; text-underline-offset: .2em; }
    .post-title { font-size: clamp(1.3rem, 3vw, 1.65rem); font-weight: 700; overflow-wrap: anywhere; }
    time, .message, .back { color: var(--muted); }
    time { font-size: .95rem; }
    .arrow { color: var(--muted); font-size: 1.2rem; }
    .message { font-size: 1.1rem; line-height: 1.5; }
    .back { display: inline-block; margin-bottom: 2.5rem; text-decoration: none; }
    .back:hover { color: #fff; }
    .article-date { display: block; margin-bottom: 1rem; }
    .article h1 { margin-bottom: 2.5rem; }
    .article-body { font-size: 1.2rem; line-height: 1.65; overflow-wrap: anywhere; }
    .article-body p { margin: 0 0 1.5rem; white-space: pre-wrap; }
    @media (max-width: 700px) {
      .site-header { min-height: 0; grid-template-columns: 1fr auto; gap: 1.25rem 1rem; padding: 1.25rem 0; }
      .logo { grid-row: 1; grid-column: 1; font-size: 1.5rem; min-height: 2.4rem; }
      .lang { grid-row: 1; grid-column: 2; }
      .nav { grid-row: 2; grid-column: 1 / -1; justify-content: center; flex-wrap: wrap; gap: .25rem 1.5rem; }
      .content { padding-top: 4rem; }
      .post-link { grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1rem; }
      .post-link time { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav a, .nav a::after, .lang-toggle, .lang-chevron, .lang-menu { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html#home">kira</a>

    <nav class="nav" aria-label="Main">
      <a href="index.html#home" data-i18n="main">main</a>
      <a href="index.html#devblog" aria-current="page" data-i18n="devblog">devblog</a>
      <a href="index.html#about" data-i18n="about">about project</a>
    </nav>

    <div class="lang">
      <button class="lang-toggle" type="button" aria-expanded="false" aria-controls="lang-menu">
        <span class="lang-label" lang="en">english</span>
        <svg class="lang-chevron" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="lang-menu" id="lang-menu">
        <ul>
          <li><button type="button" lang="en" data-lang="en" aria-current="true">english</button></li>
          <li><button type="button" lang="ja" data-lang="ja">日本語</button></li>
          <li><button type="button" lang="zh-Hans" data-lang="zh-Hans">中文</button></li>
          <li><button type="button" lang="es" data-lang="es">español</button></li>
          <li><button type="button" lang="de" data-lang="de">deutsch</button></li>
          <li><button type="button" lang="pl" data-lang="pl">polski</button></li>
        </ul>
      </div>
    </div>
  </header>
  <main class="content" id="content">
    <h1 data-i18n="devblog">devblog</h1>
    <p class="message" id="status" data-i18n="blogError">Posts could not be loaded.</p>
    <noscript><style>#status { display: none; }</style><p class="message">Enable JavaScript to read the devblog.</p></noscript>
  </main>
  <script src="posts.js" onerror="document.getElementById('status').textContent = 'Posts could not be loaded.'"></script>
  <script>
    (() => {
      if (!Array.isArray(window.kiraPosts)) return;
      const content = document.getElementById("content");
      const validDate = (date) => {
        if (typeof date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
        const parsed = new Date(date + "T00:00:00Z");
        return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === date;
      };
      const posts = window.kiraPosts.filter(post => post && typeof post.slug === "string" && typeof post.title === "string" && validDate(post.date) && Array.isArray(post.body));
      posts.sort((a, b) => b.date.localeCompare(a.date));
      const slug = new URLSearchParams(window.location.search).get("post");
      const dateElement = (date) => {
        const time = document.createElement("time");
        time.dateTime = date;
        const parsed = new Date(date + "T00:00:00Z");
        time.textContent = Number.isNaN(parsed.getTime()) ? date : new Intl.DateTimeFormat("en", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" }).format(parsed);
        return time;
      };
      if (slug !== null) {
        const post = posts.find(item => item.slug === slug);
        content.replaceChildren();
        const back = document.createElement("a");
        back.className = "back";
        back.href = "index.html#devblog";
        back.dataset.i18n = "blogBack";
        back.textContent = "← all posts";
        content.append(back);
        if (!post) {
          const heading = document.createElement("h1");
          heading.dataset.i18n = "blogNotFound";
          heading.textContent = "post not found";
          content.append(heading);
          return;
        }
        document.title = post.title + " — kira devblog";
        const article = document.createElement("article");
        article.className = "article";
        const time = dateElement(post.date);
        time.className = "article-date";
        const heading = document.createElement("h1");
        heading.dataset.postTitle = post.slug;
        heading.textContent = post.title;
        const body = document.createElement("div");
        body.className = "article-body";
        post.body.forEach((text, index) => {
          if (typeof text !== "string") return;
          const paragraph = document.createElement("p");
          paragraph.dataset.postSlug = post.slug;
          paragraph.dataset.postParagraph = String(index);
          paragraph.textContent = text;
          body.append(paragraph);
        });
        article.append(time, heading, body);
        content.append(article);
      } else if (posts.length) {
        document.getElementById("status").remove();
        const list = document.createElement("ul");
        list.className = "posts";
        posts.forEach(post => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "post-link";
          link.href = "devblog.html?post=" + encodeURIComponent(post.slug);
          const title = document.createElement("span");
          title.className = "post-title";
          title.dataset.postTitle = post.slug;
          title.textContent = post.title;
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(dateElement(post.date), title, arrow);
          item.append(link);
          list.append(item);
        });
        content.append(list);
      } else {
        const status = document.getElementById("status");
        status.dataset.i18n = "blogEmpty";
        status.textContent = "No posts yet.";
      }
    })();

    (() => {
      const root = document.querySelector(".lang");
      const toggle = root.querySelector(".lang-toggle");
      const label = root.querySelector(".lang-label");
      const items = root.querySelectorAll(".lang-menu button");
      const nav = document.querySelector(".nav");

      // add a key here + a data-i18n="key" on the element to translate more text later
      const strings = {
        "en":      { nav: "main",                  main: "main",    devblog: "devblog",           about: "about project" },
        "ja":      { nav: "メインナビゲーション",     main: "ホーム",   devblog: "開発ブログ",          about: "プロジェクトについて" },
        "zh-Hans": { nav: "主导航",                 main: "首页",     devblog: "开发博客",            about: "关于项目" },
        "es":      { nav: "navegación principal",  main: "inicio",  devblog: "blog de desarrollo", about: "sobre el proyecto" },
        "de":      { nav: "hauptnavigation",       main: "start",   devblog: "entwicklerblog",     about: "über das projekt" },
        "pl":      { nav: "nawigacja główna",      main: "główna",  devblog: "blog deweloperski",  about: "o projekcie" }
      };

      const blogStrings = {
        "en":      { blogError: "Posts could not be loaded.", blogEmpty: "No posts yet.", blogBack: "← all posts", blogNotFound: "post not found" },
        "ja":      { blogError: "記事を読み込めませんでした。", blogEmpty: "記事はまだありません。", blogBack: "← すべての記事", blogNotFound: "記事が見つかりません" },
        "zh-Hans": { blogError: "无法加载文章。", blogEmpty: "暂无文章。", blogBack: "← 所有文章", blogNotFound: "未找到文章" },
        "es":      { blogError: "No se pudieron cargar las publicaciones.", blogEmpty: "Aún no hay publicaciones.", blogBack: "← todas las publicaciones", blogNotFound: "publicación no encontrada" },
        "de":      { blogError: "Beiträge konnten nicht geladen werden.", blogEmpty: "Noch keine Beiträge.", blogBack: "← alle Beiträge", blogNotFound: "Beitrag nicht gefunden" },
        "pl":      { blogError: "Nie udało się wczytać wpisów.", blogEmpty: "Nie ma jeszcze wpisów.", blogBack: "← wszystkie wpisy", blogNotFound: "nie znaleziono wpisu" }
      };
      for (const code in blogStrings) Object.assign(strings[code], blogStrings[code]);

      const isOpen = () => root.classList.contains("is-open");
      const setOpen = (open) => {
        root.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", String(open));
      };

      toggle.addEventListener("click", () => setOpen(!isOpen()));

      const select = (code) => {
        const btn = [...items].find((b) => b.dataset.lang === code) || items[0];
        const t = strings[btn.dataset.lang];

        items.forEach((b) => b.removeAttribute("aria-current"));
        btn.setAttribute("aria-current", "true");
        label.textContent = btn.textContent;
        label.lang = btn.lang;
        document.documentElement.lang = btn.dataset.lang;

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t[el.dataset.i18n];
        });
        nav.setAttribute("aria-label", t.nav);
        const allPosts = Array.isArray(window.kiraPosts) ? window.kiraPosts : [];
        document.querySelectorAll("[data-post-title]").forEach(element => {
          const post = allPosts.find(item => item && item.slug === element.dataset.postTitle);
          if (!post) return;
          const translation = post.translations && post.translations[btn.dataset.lang];
          element.textContent = translation && typeof translation.title === "string" ? translation.title : post.title;
        });
        document.querySelectorAll("[data-post-paragraph]").forEach(element => {
          const post = allPosts.find(item => item && item.slug === element.dataset.postSlug);
          if (!post) return;
          const index = Number(element.dataset.postParagraph);
          const translation = post.translations && post.translations[btn.dataset.lang];
          const translated = translation && Array.isArray(translation.body) ? translation.body[index] : undefined;
          element.textContent = typeof translated === "string" ? translated : post.body[index];
        });
        const articleTitle = document.querySelector(".article h1[data-post-title]");
        if (articleTitle) document.title = articleTitle.textContent + " — kira devblog";
        document.querySelectorAll("time[datetime]").forEach((time) => {
          const date = new Date(time.dateTime + "T00:00:00Z");
          time.textContent = new Intl.DateTimeFormat(btn.dataset.lang, { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" }).format(date);
        });
        return btn.dataset.lang;
      };

      items.forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = select(btn.dataset.lang);
          try { localStorage.setItem("kira-lang", code); } catch (e) {}
          setOpen(false);
          toggle.focus();
        });
      });

      // restore the saved language, if there is one
      try {
        const saved = localStorage.getItem("kira-lang");
        if (saved) select(saved);
      } catch (e) {}

      document.addEventListener("click", (e) => {
        if (!root.contains(e.target)) setOpen(false);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && isOpen()) {
          setOpen(false);
          toggle.focus();
        }
      });
    })();
  </script>
</body>
</html>
